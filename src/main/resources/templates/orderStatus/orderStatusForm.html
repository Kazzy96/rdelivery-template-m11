<!-- Order Status Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${orderStatus.id == 0 ? 'Create Order Status' : 'Edit Order Status'}">Order Status Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${orderStatus.id == 0 ? 'Create Order Status' : 'Edit Order Status'}">Order Status Form</h1>

            <form th:action="${orderStatus.id == 0 ? '/backoffice/order-statuses' : '/backoffice/order-statuses/' + orderStatus.id}"
                  th:object="${orderStatus}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="name" class="form-label">Status</label>
                    <select id="name" class="form-select"
                            th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <option value="">-- Select Status --</option>
                        <option value="pending">pending</option>
                        <option value="in progress">in progress</option>
                        <option value="delivered">delivered</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${orderStatus.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/order-statuses}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
