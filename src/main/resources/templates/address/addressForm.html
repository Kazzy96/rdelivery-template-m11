<!-- Address Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${address.id == 0 ? 'Create Address' : 'Edit Address'}">Address Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-dark bg-dark px-3">
            <span class="navbar-brand">&#128640; Rocket Delivery Back Office</span>
        </nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${address.id == 0 ? 'Create Address' : 'Edit Address'}">Address Form</h1>

            <form th:action="${address.id == 0 ? '/backoffice/addresses' : '/backoffice/addresses/' + address.id}"
                  th:object="${address}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="streetAddress" class="form-label">Street Address</label>
                    <input type="text" id="streetAddress" class="form-control"
                           th:field="*{streetAddress}"
                           th:classappend="${#fields.hasErrors('streetAddress')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('streetAddress')}" th:errors="*{streetAddress}"></div>
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" class="form-control"
                           th:field="*{city}"
                           th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                </div>

                <div class="mb-3">
                    <label for="postalCode" class="form-label">Postal Code</label>
                    <input type="text" id="postalCode" class="form-control"
                           th:field="*{postalCode}"
                           th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${address.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/addresses}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
