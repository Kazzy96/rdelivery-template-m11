<!-- Restaurant List - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Restaurant List - Rocket Delivery</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3">Restaurants</h1>
                <a th:href="@{/backoffice/restaurants/new}" class="btn btn-primary">+ Create New</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <table class="table table-striped table-hover bg-white">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Price Range</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="restaurant : ${restaurants}">
                        <td th:text="${restaurant.id}"></td>
                        <td th:text="${restaurant.name}"></td>
                        <td th:text="${restaurant.email}"></td>
                        <td th:text="${restaurant.phone}"></td>
                        <td th:text="${restaurant.priceRange}"></td>
                        <td th:text="${restaurant.active ? 'Yes' : 'No'}"></td>
                        <td>
                            <a th:href="@{/backoffice/restaurants/{id}/edit(id=${restaurant.id})}" class="btn btn-sm btn-warning me-1">Edit</a>
                            <form th:action="@{/backoffice/restaurants/{id}/delete(id=${restaurant.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(restaurants)}">
                        <td colspan="7" class="text-center text-muted">No records found.</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
