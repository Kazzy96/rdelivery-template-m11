<!-- Restaurant Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${restaurant.id == 0 ? 'Create Restaurant' : 'Edit Restaurant'}">Restaurant Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${restaurant.id == 0 ? 'Create Restaurant' : 'Edit Restaurant'}">Restaurant Form</h1>

            <form th:action="${restaurant.id == 0 ? '/backoffice/restaurants' : '/backoffice/restaurants/' + restaurant.id}"
                  th:object="${restaurant}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="userId" class="form-label">User</label>
                    <select id="userId" class="form-select"
                            th:field="*{user.id}"
                            th:classappend="${#fields.hasErrors('user')} ? 'is-invalid'">
                        <option value="">-- Select User --</option>
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('user')}" th:errors="*{user}"></div>
                </div>

                <div class="mb-3">
                    <label for="addressId" class="form-label">Address</label>
                    <select id="addressId" class="form-select"
                            th:field="*{address.id}"
                            th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                        <option value="">-- Select Address --</option>
                        <option th:each="a : ${addresses}" th:value="${a.id}"
                                th:text="${a.streetAddress + ', ' + a.city}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" id="phone" class="form-control"
                           th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="priceRange" class="form-label">Price Range (1–3)</label>
                    <input type="number" id="priceRange" class="form-control" min="1" max="3"
                           th:field="*{priceRange}"
                           th:classappend="${#fields.hasErrors('priceRange')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('priceRange')}" th:errors="*{priceRange}"></div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" id="active" class="form-check-input" th:field="*{active}">
                    <label for="active" class="form-check-label">Active</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${restaurant.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/restaurants}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
