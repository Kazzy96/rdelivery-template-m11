<!-- Product Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${product.id == 0 ? 'Create Product' : 'Edit Product'}">Product Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${product.id == 0 ? 'Create Product' : 'Edit Product'}">Product Form</h1>

            <form th:action="${product.id == 0 ? '/backoffice/products' : '/backoffice/products/' + product.id}"
                  th:object="${product}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="restaurantId" class="form-label">Restaurant</label>
                    <select id="restaurantId" class="form-select"
                            th:field="*{restaurant.id}"
                            th:classappend="${#fields.hasErrors('restaurant')} ? 'is-invalid'">
                        <option value="">-- Select Restaurant --</option>
                        <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('restaurant')}" th:errors="*{restaurant}"></div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="3"
                              th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="cost" class="form-label">Cost</label>
                    <input type="number" id="cost" class="form-control" min="0"
                           th:field="*{cost}"
                           th:classappend="${#fields.hasErrors('cost')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${product.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/products}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
