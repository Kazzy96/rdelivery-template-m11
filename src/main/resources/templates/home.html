<!-- Home - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rocket Delivery Back Office</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4">Back Office Dashboard</h1>
            <div class="row g-3">
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/users}" class="btn btn-outline-dark w-100 py-3">&#128100; Users</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/addresses}" class="btn btn-outline-dark w-100 py-3">&#128205; Addresses</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/employees}" class="btn btn-outline-dark w-100 py-3">&#128188; Employees</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/restaurants}" class="btn btn-outline-dark w-100 py-3">&#127869; Restaurants</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/customers}" class="btn btn-outline-dark w-100 py-3">&#128101; Customers</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/products}" class="btn btn-outline-dark w-100 py-3">&#127828; Products</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/order-statuses}" class="btn btn-outline-dark w-100 py-3">&#128203; Order Statuses</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/orders}" class="btn btn-outline-dark w-100 py-3">&#128666; Orders</a>
                </div>
                <div class="col-md-4 col-sm-6">
                    <a th:href="@{/backoffice/product-orders}" class="btn btn-outline-dark w-100 py-3">&#128722; Product Orders</a>
                </div>
            </div>
        </main>
    </body>
</html>
