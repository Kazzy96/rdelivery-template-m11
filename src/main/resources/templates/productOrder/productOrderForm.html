<!-- Product Order Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${productOrder.id == 0 ? 'Create Product Order' : 'Edit Product Order'}">Product Order Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${productOrder.id == 0 ? 'Create Product Order' : 'Edit Product Order'}">Product Order Form</h1>

            <form th:action="${productOrder.id == 0 ? '/backoffice/product-orders' : '/backoffice/product-orders/' + productOrder.id}"
                  th:object="${productOrder}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="productId" class="form-label">Product</label>
                    <select id="productId" class="form-select"
                            th:field="*{product.id}"
                            th:classappend="${#fields.hasErrors('product')} ? 'is-invalid'">
                        <option value="">-- Select Product --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('product')}" th:errors="*{product}"></div>
                </div>

                <div class="mb-3">
                    <label for="orderId" class="form-label">Order</label>
                    <select id="orderId" class="form-select"
                            th:field="*{order.id}"
                            th:classappend="${#fields.hasErrors('order')} ? 'is-invalid'">
                        <option value="">-- Select Order --</option>
                        <option th:each="o : ${orders}" th:value="${o.id}"
                                th:text="'Order #' + ${o.id} + ' - ' + ${o.restaurant.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('order')}" th:errors="*{order}"></div>
                </div>

                <div class="mb-3">
                    <label for="productQuantity" class="form-label">Quantity</label>
                    <input type="number" id="productQuantity" class="form-control" min="1"
                           th:field="*{productQuantity}"
                           th:classappend="${#fields.hasErrors('productQuantity')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('productQuantity')}" th:errors="*{productQuantity}"></div>
                </div>

                <div class="mb-3">
                    <label for="productUnitCost" class="form-label">Unit Cost</label>
                    <input type="number" id="productUnitCost" class="form-control" min="0"
                           th:field="*{productUnitCost}"
                           th:classappend="${#fields.hasErrors('productUnitCost')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('productUnitCost')}" th:errors="*{productUnitCost}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${productOrder.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/product-orders}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
