<!-- Product Order List - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Order List - Rocket Delivery</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-dark bg-dark px-3">
            <span class="navbar-brand">🚀 Rocket Delivery Back Office</span>
        </nav>
        <main class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3">Product Orders</h1>
                <a th:href="@{/backoffice/product-orders/new}" class="btn btn-primary">+ Create New</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <table class="table table-striped table-hover bg-white">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Order ID</th>
                        <th>Quantity</th>
                        <th>Unit Cost</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="productOrder : ${productOrders}">
                        <td th:text="${productOrder.id}"></td>
                        <td th:text="${productOrder.product.name}"></td>
                        <td th:text="${productOrder.order.id}"></td>
                        <td th:text="${productOrder.productQuantity}"></td>
                        <td th:text="${productOrder.productUnitCost}"></td>
                        <td>
                            <a th:href="@{/backoffice/product-orders/{id}/edit(id=${productOrder.id})}" class="btn btn-sm btn-warning me-1">Edit</a>
                            <form th:action="@{/backoffice/product-orders/{id}/delete(id=${productOrder.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productOrders)}">
                        <td colspan="6" class="text-center text-muted">No records found.</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
