<!-- User Form - Rocket Delivery Back Office -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${user.id == 0 ? 'Create User' : 'Edit User'}">User Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        <main class="container py-4">
            <h1 class="h3 mb-4" th:text="${user.id == 0 ? 'Create User' : 'Edit User'}">User Form</h1>

            <form th:action="${user.id == 0 ? '/backoffice/users' : '/backoffice/users/' + user.id}"
                  th:object="${user}" method="post" class="card p-4 bg-white">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${user.id == 0 ? 'Create' : 'Update'}">Submit</button>
                    <a th:href="@{/backoffice/users}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
